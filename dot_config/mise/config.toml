[tools]
java            = "temurin-21"
kotlin          = "2.3"
python          = "3.13"
node            = "22"
go              = "1.25"
"npm:typescript" = "latest"

[settings]
# chezmoi source tree 아래의 mise config.*.toml들을 자동 신뢰
# (cd 시 'Config files ... are not trusted' 에러 방지)
trusted_config_paths = ["~/.local/share/chezmoi"]

# 환경별 설정은 config.{env}.toml 에 분리.
#   MISE_ENV=local mise current
#   MISE_ENV=dev   mise env
#   MISE_ENV=prod  mise exec -- cmd
